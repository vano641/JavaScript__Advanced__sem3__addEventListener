<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Задача 2
    1) Создать в html 3 кнопки button c нумерацией 1,2,3
    2) Добавить клик на кнопку, чтобы в консоль выводилась именно та кнопка, на которую мы нажали
    3) Добавить кнопку button с текстом 4, которая считает сколько раз на нее нажали и 
    количество нажатий на эту кнопку выводит в консоль
    4) Создать кнопку button с текстом 5. При клике не которую меняется текст данной кнопки на "Вы нажали эту кнопку" -->

    <button class="button1">Кнопка 1</button>
    <button class="button1">Кнопка 2</button>
    <button class="button1">Кнопка 3</button>

    <button class="button2">Кнопка 4</button>
    <button class="button3">Кнопка 5</button>
    <script>
    // 1.
        const buttons = document.querySelectorAll('.button1');
        buttons.forEach(element => {
            element.addEventListener('click', event => {
                const target = event.target;
                console.log(target);
            })
        });
    // 2.
        const button2El = document.querySelector('.button2');
        let count = 0;
        button2El.addEventListener('click', function (e) {
            console.log(++count);
        })
    // 3.
        const button3El = document.querySelector('.button3');
        button3El.addEventListener('click', function (e) {
            button3El.textContent = 'Вы нажали эту кнопку';
            
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Задача 4
    1) Создать html список из 3ех элементов li
    2) Сделать кнопку которая будет добавлять элементы списка с текстом "Новый элемент списка"
    3) Создать кнопку, которая будет удалять первый элемент из созданного списка
    4) Создать кнопку, при клике на которую ей добавляется класс "click" -->

    <ul class="ul">
        <li class="list">"Элемент списка 1</li>
        <li class="list">"Элемент списка 2</li>
        <li class="list">"Элемент списка 3</li>
    </ul>

    <button class="buttonAdd">add item</button>
    <button class="buttonRemove">remove item</button>
    
    <script>
    // 1.
        const ulEl = document.querySelector('.ul');
        const buttonAddEl = document.querySelector('.buttonAdd');
        const buttonRemoveEl = document.querySelector('.buttonRemove');

        const listEl = document.createElement('li');
        listEl.textContent = 'Новый элемент списка';

        buttonAddEl.addEventListener('click', function (e) {
            const listEl = document.createElement('li');
            listEl.textContent = 'Новый элемент списка';
            listEl.classList.add('list');
            ulEl.appendChild(listEl);
        });
    // 2.
        buttonRemoveEl.addEventListener('click', function (e) {
            const firstListEl = document.querySelector('.list:first-child');
            ulEl.removeChild(firstListEl);
        })
    </script>
</body>
</html>

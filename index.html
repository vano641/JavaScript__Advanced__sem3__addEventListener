<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Задача 3
    1) Создать кнопку, которая добавляет h1 с текстом "Новый заголовок",
    данный элемент нужно расположить после кнопки.
    2) Создать вторую кнопку, которая будет удалять созданный заголовок h1
    3) Создать третью кнопку, при Наведении на которую в консоль будет выводиться текст "вы навели на данную кнопку",
    как только курсор уводится с кнопки, в консоли должен появиться текст "Наведения больше нет" -->

    <div class="content">
        <button class="button1">Добавить h1</button>
        <button class="button2">Удалить h1</button>
        <button class="button3">Hover</button>
    </div>
    
    
    <script>
    // 1.
        const button1El = document.querySelector('.button1');
        const button2El = document.querySelector('.button2');
        const button3El = document.querySelector('.button3');

        const h1El = document.createElement('h1');
        h1El.textContent = 'Новый заголовок';

        button1El.addEventListener('click', function (e) {
            button1El.parentElement.appendChild(h1El);
        });
    // 2.
        button2El.addEventListener('click', function (e) {
            button2El.parentElement.removeChild(h1El);
        })
    // 3.
        button3El.addEventListener('mouseover', function (e) {
            console.log('Навели');
            console.log(e.target); // в момент наведения можно работать с элементом
        });

        button3El.addEventListener('mouseout', function (e) {
            console.log('Убрали');
        });
        
    </script>
</body>
</html>
